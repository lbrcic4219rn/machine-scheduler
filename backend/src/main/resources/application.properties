# Server
# 8081 is what the Angular frontend targets (frontend/src/environments/environment.ts).
server.port=${SERVER_PORT:8081}
# Datasource
# Override any of these with environment variables; the defaults assume a local MySQL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/machine_scheduler?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# Dialect is auto-detected from the connection; do not pin it.
# JPA / Hibernate
# BootstrapData seeds admin@mail.com plus 20 users on every startup and User.email
# is unique, so the schema is rebuilt each run. Switch to "update" only after
# removing or guarding that seeding, otherwise the second startup fails on a
# duplicate key.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.open-in-view=false
# JWT
# MUST be overridden outside local development. Base64-encoded, at least 64 bytes
# (HS512): openssl rand -base64 64
app.jwt.secret=${APP_JWT_SECRET:gdPbVAf56ohs1jt7ikVsgGIVb9byFTaFu8s66coeXbX3Ks/T2luQrvPALEzNWM3eEwhqQ4Smg3Y73lCGyoV6kg==}
# Seed data
# Password of the admin@mail.com account created by BootstrapData on startup.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin}
# Sample users user1@mail.com..user20@mail.com get this prefix followed by their number.
app.seed.user-password-prefix=${SEED_USER_PASSWORD_PREFIX:pass}
